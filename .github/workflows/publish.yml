name: Publier

# Publie sur npmjs.com, en public : une app installe le paquet sans jeton ni .npmrc.
# Une version = un tag : `npm version patch` (ou minor, major), puis `git push --follow-tags`.
# Ou à la main (onglet Actions, « Run workflow ») : publie la version inscrite dans package.json,
# puis pose le tag `v<version>` s'il manque. Le champ « commit » publie ou tague un commit
# antérieur ; une version déjà publiée n'est pas republiée, seul son tag est posé.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branche ou tag à publier (vide : la branche choisie)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Écriture : pousser le tag de la version. Un tag poussé par ce jeton ne relance pas ce workflow.
      contents: write
      # Publication de confiance (trusted publishing) : npm échange le jeton OIDC de GitHub Actions
      # contre le droit de publier, sans secret. Le paquet déclare ce workflow comme éditeur de
      # confiance sur npmjs.com (Settings → Trusted Publisher).
      id-token: write
    env:
      # Seulement pour la PREMIÈRE publication, avant que le paquet existe sur npmjs.com et qu'on
      # puisse y déclarer l'éditeur de confiance : un jeton npm granulaire, en secret NPM_TOKEN.
      # Le supprimer ensuite : npm tente l'OIDC d'abord et ne retombe sur un jeton qu'à défaut.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm 10 bute sur la résolution des dépendances pair à l'installation : npm 11 (npm ci, lui, passe).
      # La publication de confiance demande au moins npm 11.5.1.
      - run: npm install -g npm@11
      - id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version est déjà publiée : seul le tag sera posé."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: npm ci
      - if: steps.version.outputs.published == 'false'
        run: npm test
      - if: steps.version.outputs.published == 'false'
        run: npm run build
      - if: steps.version.outputs.published == 'false'
        run: npm publish
      - name: Poser le tag
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG existe déjà."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "${TAG#v}"
          git push origin "refs/tags/$TAG"
