name: Publier

# Une version = un tag : `npm version patch` (ou minor, major), puis `git push --follow-tags`.
# Ou à la main (onglet Actions, « Run workflow ») : publie la version inscrite dans package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@yoannyviquel'
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
